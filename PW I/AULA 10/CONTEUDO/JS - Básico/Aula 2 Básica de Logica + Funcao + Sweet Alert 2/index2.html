<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Valores</title>

    <!-- CSS Externo -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="container">

        <h1>Calculadora de Valores</h1>

        <input type="number" id="valor1" placeholder="Digite o primeiro valor">

        <input type="number" id="valor2" placeholder="Digite o segundo valor">

        <button onclick="somar()">
            Somar
        </button>
        <br><br>
        <button onclick="subtrair()">
            Subtrair
        </button>
        <br><br>
        <button onclick="multiplicar()">
            Multiplicar
        </button>
        <br><br>
        <button onclick="dividir()">
            Dividir
        </button>
        <br><br>
        <div id="resultado"></div>

    </div>

</body>

</html>
